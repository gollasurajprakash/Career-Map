<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suraj Prakash – Career Map</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#161c2d;--muted:#667089;--line:#d5dbea;--glass:rgba(255,255,255,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#171c2a;--text:#e9edfb;--muted:#98a2bd;--line:#2c3550;--glass:rgba(23,28,42,.85)}}
:root[data-theme="dark"]{--bg:#0d1017;--card:#171c2a;--text:#e9edfb;--muted:#98a2bd;--line:#2c3550;--glass:rgba(23,28,42,.85)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 8% -10%,rgba(99,102,241,.25),transparent),radial-gradient(700px 500px at 100% 0,rgba(236,72,153,.18),transparent),var(--bg);background-attachment:fixed}
main{max-width:1000px;margin:0 auto;padding:36px 20px 56px}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
h1{margin:6px 0 4px;font-size:clamp(2rem,5vw,3rem);background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0 0 34px;color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px}
.map{position:relative;padding:6px 0}
#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
#wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 10;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes fade{from{opacity:0}}
.row{display:flex;margin-bottom:38px;animation:fade .6s both;animation-delay:var(--d)}
.row.r1{padding-left:90px}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer;color:var(--text);font:inherit;text-align:left}
.dot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--card);border:2px solid var(--c);transition:.25s}
.node:hover .dot,.node:focus-visible .dot{transform:scale(1.1);box-shadow:0 0 24px -2px var(--c)}
.node.on .dot{background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 25%,transparent),0 0 30px var(--c)}
.t b{display:block}.t small{color:var(--muted)}
.side{display:grid}
.hint{grid-area:1/1;align-self:center;text-align:center;color:var(--muted);padding:44px 20px;border:1.5px dashed var(--line);border-radius:18px;transition:.2s}
.side.open .hint{opacity:0}
.panel{grid-area:1/1;align-self:start;position:sticky;top:calc(20px + env(safe-area-inset-top,0px));background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:18px;padding:22px;box-shadow:0 24px 50px -24px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateX(28px) scale(.98);transition:.28s}
.panel.show{opacity:1;visibility:visible;transform:none}
.x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-right:20px}
.ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ph h2{margin:0;font-size:1.15rem}.ph p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.chip{display:inline-block;font-size:.78rem;padding:3px 11px;border-radius:99px;background:var(--c);color:#fff;margin-bottom:14px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.35rem;color:var(--c)}.stats small{color:var(--muted)}
.panel ul{margin:0 0 14px;padding-left:20px;line-height:1.65;font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font-style:normal;font-size:.76rem;padding:3px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
@media (max-width:820px){
.stage{grid-template-columns:1fr}
.row.r1{padding-left:44px}
.hint{display:none}
.panel{position:fixed;grid-area:auto;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;z-index:5;transform:translateY(24px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Interactive career map</div>
<h1>Suraj Prakash</h1>
<p>Software Engineer · Performance Engineering, CDOT</p>
</header>
<div class="stage">
<div class="map" id="map"><svg id="wires"></svg></div>
<div class="side" id="side"><div class="hint">Click a node to see its details.<br>Move the cursor away to hide them.</div><aside class="panel" id="panel"></aside></div>
</div>
</main>
<script>
// EDIT THIS LIST to change the story.
const N=[
{c:"#f59e0b",icon:"🏫",label:"School",period:"2002 – 2012",title:"School",place:"S.F.S High School, Tanuku, Andhra Pradesh",stats:[["CGPA","9.5"]],pts:["Completed school education in Tanuku, Andhra Pradesh"],tags:["Andhra Pradesh"]},
{c:"#10b981",icon:"📘",label:"Intermediate",period:"2012 – 2014",title:"Intermediate Education",place:"Narayana College, Vijayawada, Andhra Pradesh",stats:[["Marks","981 / 1000"]],pts:["Stream: M.P.C (Maths, Physics, Chemistry)"],tags:["M.P.C"]},
{c:"#3b82f6",icon:"🎓",label:"B.Tech",period:"2014 – 2018",title:"B.Tech",place:"National Institute of Technology (NIT), Trichy, Tamil Nadu",stats:[["CGPA","7.03"]],pts:["Branch: Computer Science & Engineering"],tags:["CSE","NIT Trichy"]},
{c:"#8b5cf6",icon:"💼",label:"Job",period:"2018 – Present",title:"Software Engineer",place:"CDOT · Performance Engineering team",pts:["Work on 4G/LTE dataplane systems","Fast packet processing with DPDK, ODP and OFP","Performance tuning of Mellanox and Intel NICs","Virtualization with SR-IOV, KVM and NUMA","Work on 5G UPF","Use Docker, Kubernetes and OpenStack"],tags:["4G/LTE","5G UPF","DPDK","ODP/OFP","SR-IOV","KVM","NUMA","Docker","Kubernetes","OpenStack"]},
{c:"#ec4899",icon:"🤖",label:"M.Tech",period:"2024 – 2026",title:"M.Tech in AI/ML",place:"BITS Pilani, Rajasthan",stats:[["CGPA","9.33"]],pts:["Joined the Work Integrated Learning Program (WILP)","Studying while working full time"],tags:["AI/ML","WILP"]}
];
const $=s=>document.querySelector(s),map=$("#map"),svg=$("#wires"),panel=$("#panel"),side=$("#side");
let cur=-1,timer;
N.forEach((n,i)=>{
  const r=document.createElement("div");r.className="row"+(i%2?" r1":"");r.style.setProperty("--d",i*.12+"s");
  const b=document.createElement("button");b.className="node";b.style.setProperty("--c",n.c);b.setAttribute("aria-expanded","false");
  b.innerHTML=`<div class="dot">${n.icon}</div><div class="t"><b>${n.label}</b><small>${n.period}</small></div>`;
  b.onclick=()=>cur===i?close():open(i);
  b.onpointerenter=keep;b.onpointerleave=leave;
  r.appendChild(b);map.appendChild(r);
});
panel.onpointerenter=keep;panel.onpointerleave=leave;
function keep(){clearTimeout(timer)}
function leave(e){if(e.pointerType==="mouse"){clearTimeout(timer);timer=setTimeout(close,450)}}
function open(i){
  keep();cur=i;const n=N[i];panel.style.setProperty("--c",n.c);
  panel.innerHTML=`<button class="x" aria-label="Close">✕</button><div class="ph"><div class="ic">${n.icon}</div><div><h2>${n.title}</h2><p>${n.place}</p></div></div><span class="chip">${n.period}</span>`+
  (n.stats?`<div class="stats">${n.stats.map(s=>`<div><b>${s[1]}</b><small>${s[0]}</small></div>`).join("")}</div>`:"")+
  `<ul>${n.pts.map(p=>`<li>${p}</li>`).join("")}</ul><div class="tags">${n.tags.map(t=>`<i>${t}</i>`).join("")}</div>`;
  panel.querySelector(".x").onclick=close;
  panel.classList.add("show");side.classList.add("open");mark();
}
function close(){cur=-1;panel.classList.remove("show");side.classList.remove("open");mark()}
function mark(){map.querySelectorAll(".node").forEach((b,j)=>{b.classList.toggle("on",j===cur);b.setAttribute("aria-expanded",j===cur)})}
document.addEventListener("pointerdown",e=>{if(cur>-1&&!e.target.closest(".node,.panel"))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function draw(){
  const m=map.getBoundingClientRect();
  svg.setAttribute("width",m.width);svg.setAttribute("height",m.height);
  const p=[...map.querySelectorAll(".dot")].map(d=>{const r=d.getBoundingClientRect();return[r.left-m.left+r.width/2,r.top-m.top+r.height/2]});
  svg.innerHTML=p.slice(1).map((q,i)=>{const a=p[i],y=(a[1]+q[1])/2;return`<path d="M${a[0]} ${a[1]}C${a[0]} ${y} ${q[0]} ${y} ${q[0]} ${q[1]}" stroke="${N[i].c}"/>`}).join("");
}
addEventListener("resize",draw);addEventListener("load",draw);draw();
</script>
</body>
</html>
